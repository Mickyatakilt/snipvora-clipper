<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snipvora clips</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snipvora"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0f1020">
<style>
:root{--bg:#0f1020;--card:#181a30;--line:#2a2c44;--fg:#eee;--mut:#99a;--acc:#6c5ce7;--ok:#00b894}
@media (prefers-color-scheme: light){:root{--bg:#f4f5fb;--card:#fff;--line:#dcdfee;--fg:#14152a;--mut:#667}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px -apple-system,system-ui,sans-serif;padding:16px 16px 60px;max-width:820px;margin:auto}
h1{margin:6px 0 2px}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
video{width:100%;aspect-ratio:9/16;max-height:72vh;object-fit:contain;border-radius:10px;background:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,a.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;text-decoration:none;cursor:pointer}
button.ok{background:var(--ok)}pre{white-space:pre-wrap;background:rgba(127,127,160,.12);border-radius:8px;padding:8px;margin:8px 0 0;font:inherit}
.done{opacity:.55}
.phone{position:relative;width:min(100%,340px);aspect-ratio:9/16;margin:10px auto;border-radius:18px;overflow:hidden;background:#000}
.phone video{width:100%;height:100%;max-height:none;object-fit:cover;border-radius:0;display:block}
.ov{position:absolute;left:0;right:0;bottom:0;padding:48px 64px 16px 12px;color:#fff;font-size:13px;line-height:1.35;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;white-space:pre-wrap}
.ov b{display:block;margin-bottom:3px;font-size:14px}
.side{position:absolute;right:8px;bottom:70px;display:flex;flex-direction:column;gap:14px;color:#fff;font-size:11px;text-align:center;pointer-events:none}
.side i{display:block;font-style:normal;font-size:24px}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:#fff;background:none;border:0;opacity:.9}
.badge{display:inline-block;border-radius:8px;padding:3px 9px;font-weight:700;color:#012}
.g-hi{background:#00b894}.g-mid{background:#fdcb6e}.g-lo{background:#ff7675}.g-na{background:#99a}
button.del{background:#d63031}button.edit{background:#0984e3}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.55)}textarea,input[type=datetime-local]{width:100%;background:rgba(127,127,160,.12);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;margin-top:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:10px 14px;display:none;max-width:90vw;font-size:13px}
.tabs{display:flex;gap:8px;margin:10px 0}.tab{background:var(--card);color:var(--fg);border:1px solid var(--line)}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pill{font-size:11px;border-radius:8px;padding:2px 7px;background:var(--ok);color:#012}.pill.w{background:#fdcb6e}
.jbar{height:8px;border-radius:6px;background:rgba(127,127,160,.25);overflow:hidden;margin:6px 0}.jbar i{display:block;height:100%;width:35%;background:var(--acc,#6c5ce7);border-radius:6px;animation:jb 1.3s ease-in-out infinite}@keyframes jb{0%{margin-left:-35%}100%{margin-left:100%}}
.jrun{border:2px solid #6c5ce7;border-radius:10px;padding:10px;margin:8px 0}.jfail{border:2px solid #d63031;border-radius:10px;padding:10px;margin:8px 0}
ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--mut)}#camps{display:none}
</style></head><body>
<h1>Snipvora</h1>
<div class="tabs"><button id="t1" class="tab on">Clips</button><button id="t2" class="tab">Campaigns</button><button id="t3" class="tab">Approvals</button></div>
<div class="mut" id="meta">Loading...</div>
<div class="card" id="pushbox"><b>Phone alerts</b>
<div class="mut" id="pushmsg">Pop-ups on this app: new clips, posted, failures.</div>
<div class="row"><button class="ok" id="pushbtn">Enable notifications</button></div>
<textarea id="pushsub" rows="4" style="display:none;width:100%" readonly></textarea>
<div class="row"><button id="pushcopy" style="display:none">Copy code</button></div></div>
<div id="list"></div>
<div id="camps"></div>
<div id="appr" style="display:none"></div>
<p class="mut">Page v24 · deleted TikToks hide automatically (checked every 6 hours). Lady A clips: tap SHARE TO TIKTOK on the clip. Other clips: tap Download, then Copy caption in TikTok.</p>
<script>
const REPO="Mickyatakilt/snipvora-clipper";
const done=(()=>{try{return JSON.parse(localStorage.getItem("done")||"{}")}catch(e){return{}}})();
const save=()=>{try{localStorage.setItem("done",JSON.stringify(done))}catch(e){}};
let showOld=location.hash==="#old";let stage="todo";try{stage=sessionStorage.getItem("stage")||"todo"}catch(e){}
function delBadge(pp){const d=new Date(new Date(pp.postedAt).getTime()+30*864e5),n=Math.ceil((d-Date.now())/864e5);return n>0?`<span class="badge g-lo">Keep live until ${d.toLocaleDateString()} (${n}d left)</span>`:`<span class="badge g-hi">30 days passed: OK to delete on TikTok</span>`}
function stageOf(pp){if(!pp)return"todo";if(pp.deleted)return"gone";if(pp.submitted)return"done";return(Date.now()-new Date(pp.postedAt)>18e5)?"done":"posted"}
const WORKER_URL="https://snipvora-helper.mickyatakilt.workers.dev"; // set when the Cloudflare helper is deployed
const gone=(()=>{try{return JSON.parse(localStorage.getItem("gone")||"{}")}catch(e){return{}}})();
const save2=()=>{try{localStorage.setItem("gone",JSON.stringify(gone))}catch(e){}};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",4500)}
async function send(type,payload){
  // only "post" talks to the helper; delete is hidden on this device, edit is a note (neither is sent anywhere)
  if(type!=="post")return true;
  try{
    const when=payload.when?new Date(payload.when).toISOString():"";
    const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({video:payload.video,caption:payload.description,when})});
    if(!r.ok){const j=await r.json().catch(()=>({}));toast("Post not sent: "+(j.error||r.status));return false}
    toast("Sent ✓ posting started (takes about 2 minutes)");return true;
  }catch(e){toast("Could not reach the helper. Not sent.");return false}
}
function ask(title,text,withTime,cb){
  const dlg=document.getElementById("dlg");dlg.querySelector("h3").textContent=title;
  const ta=dlg.querySelector("textarea");ta.value=text||"";dlg.querySelector("[data-t]").style.display=withTime?"block":"none";
  dlg.querySelector("[data-ok]").onclick=()=>{const w=dlg.querySelector("input").value;dlg.close();cb(ta.value,w)};
  dlg.showModal();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function main(){
  const meta=document.getElementById("meta"),list=document.getElementById("list");
  try{
    const r=await fetch("clips.json",{cache:"no-store"});
    if(!r.ok) throw new Error("clips.json "+r.status);
    const clips=await r.json();window._clipCamps=[...new Set(clips.map(c=>c.campaign).filter(Boolean))];
    if(!clips.length){meta.textContent="No clips yet. The next cloud run will add them.";return}
    meta.textContent="Latest run: "+new Date(clips[0].published).toLocaleString()+" · older clips are removed automatically";
    const ageH=(Date.now()-new Date(clips[0].published))/36e5;
    if(ageH>36)meta.innerHTML+='<br><b style="color:#d33">⚠ No new clips for '+Math.round(ageH)+'h. The cloud job may be blocked.</b>';
    const newest=clips[0].tag;
    let posted={};try{posted=await (await fetch("posted.json",{cache:"no-store"})).json()}catch(e){}
    const nz=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");let dropped=[];
    try{dropped=(await (await fetch("campaigns.json",{cache:"no-store"})).json()).filter(c=>c.ineligible).map(c=>nz(c.title))}catch(e){}
    const isDropped=c=>!!c.campaign&&dropped.some(d=>d.includes(nz(c.campaign)));
    const cnt={todo:0,posted:0,done:0};
    for(const c of clips){if(!gone[c.video]&&c.tag===newest&&!isDropped(c)&&stageOf(posted[c.video])==="todo")cnt.todo++}
    for(const k in posted){const st=stageOf(posted[k]);if(st!=="todo"&&st!=="gone")cnt[st]++}
    const tabs=document.createElement("div");tabs.className="row";
    for(const [k,t] of [["todo","New clips"],["posted","Posted"],["done","Done"]]){const b=document.createElement("button");b.className=k===stage?"ok":"btn";b.textContent=t+" ("+cnt[k]+")";
      b.onclick=()=>{try{sessionStorage.setItem("stage",k)}catch(e){}location.reload()};tabs.appendChild(b)}
    list.appendChild(tabs);
    const hint={todo:"New clips ready to post.",posted:"On TikTok. Submit the link within 30 minutes of posting.",done:"Submitted, or the 30-minute window passed. Nothing is deleted."};
    const hp=document.createElement("p");hp.className="mut";hp.textContent=hint[stage];list.appendChild(hp);
    for(const c of clips){
      const id=c.video; if(gone[id]) continue;
      if(stageOf(posted[id])!==stage) continue;
      if(stage==="todo"&&isDropped(c)) continue;
      if(stage==="todo"&&c.tag!==newest&&!showOld) continue;
      const g=c.grade, gc=g==null?"g-na":g>=8?"g-hi":g>=5?"g-mid":"g-lo";
      const d=document.createElement("div");const pp=posted[id];d.className="card"+((done[id]||pp)?" done":"");
      d.innerHTML=`<div><b>${esc(c.campaign||"Campaign clip")}</b> <span class="mut">${c.mb} MB</span>
        <span class="badge ${gc}">${g==null?"Not graded":g+"/10"}</span></div>
        <div class="mut">${esc(g==null?"Grading turns on once the OpenAI key is added.":c.reason)}</div>
        <div class="phone"><video playsinline webkit-playsinline preload="${isLady(c)?"none":"metadata"}" muted poster="${c.poster}" src="${c.video}" loop></video>
          <button class="play" aria-label="Play">▶</button>
          <div class="side"><div><i>♥</i>Like</div><div><i>💬</i>Chat</div><div><i>↗</i>Share</div></div>
          <div class="ov"><b>@snipvora</b>${esc(c.caption)}</div></div>
        ${pp?`<div class="row"><span class="badge g-hi">Posted ✓ ${new Date(pp.postedAt).toLocaleString()}</span> ${delBadge(pp)}</div>
        <div class="row">${pp.submitted?`<span class="badge g-hi">Submitted ✓</span>`:stage==="done"?`<span class="badge g-lo">Missed 30-min window</span>`:`<button class="ok" data-u>Upload link to campaign</button>`}<a class="btn" href="${pp.url}" target="_blank" rel="noopener">View on TikTok</a></div>
        ${pp.submitted?`<div class="mut">Submitted to the campaign. Keep the TikTok post live for 30 days.</div>`:stage==="done"?`<div class="mut">Not submitted in time. Keep the TikTok post live for 30 days anyway.</div>`:`<div class="mut">Submit within 30 minutes of posting. Tap "Upload link": it copies your TikTok link and opens the campaign. Then tap Submit clip and paste.</div>`}`:""}
        ${c.note?`<div class="mut">${isLady(c)?"Tap POST TO TIKTOK. It runs your Lady A Shortcut: caption copied, pick TikTok, Video, add the official sound, paste, Post. Page v24":"⚠ "+esc(c.note)}</div>`:""}
        <div class="row">${pp?"":isLady(c)?`<a class="btn ok" href="shortcuts://run-shortcut?name=Lady%20A">POST TO TIKTOK</a>`:c.note?"":`<button class="ok" data-p>Post</button>`}<button class="edit" data-e>Edit</button><button class="del" data-x>Delete</button>
          ${isLady(c)&&!pp?"":`<a class="btn" href="${c.video}" download>Download</a><button data-c>${pp?"Copy TikTok link":"Copy caption"}</button>`}</div>
        <div class="mut" data-s>${done[id]?"Posted ✓":""}</div>`;
      const v=d.querySelector("video"),pl=d.querySelector(".play");
      const tog=()=>{if(v.paused){document.querySelectorAll("video").forEach(o=>o.pause());v.muted=false;pl.style.display="none";v.play().catch(e=>{pl.style.display="";if(e&&e.name==="AbortError")return;d.querySelector("[data-s]").textContent="Cannot play preview ("+(e.name||e)+"). The SHARE TO TIKTOK button still works."})}else{v.pause();pl.style.display=""}};
      pl.onclick=tog;v.onclick=tog;v.onerror=()=>{pl.style.display="";d.querySelector("[data-s]").textContent="Preview failed to load (code "+(v.error&&v.error.code)+"). The SHARE TO TIKTOK button still works."};
      const cb=d.querySelector("[data-c]");if(cb)cb.onclick=async e=>{const b=e.target,cu=(pp&&pp.campaignUrl)||c.campaignUrl||"https://contentrewards.com/c/campaigns/7a73a53b-2bba-4a5c-8187-05534dd6716d";
        const txt=pp&&pp.url?pp.url:c.caption;let ok=true;
        try{await navigator.clipboard.writeText(txt)}catch(x){ok=false;const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{ok=document.execCommand("copy")}catch(y){}t.remove()}
        b.textContent=ok?(pp?"Link copied ✓ paste it in Submit clip":"Copied ✓ campaign opened"):"Copy failed: "+txt;
        if(ok)window.open(cu,"_blank")};
      d.querySelector("[data-x]").onclick=()=>{if(confirm("Delete this clip?")){gone[id]=1;save2();send("delete",{video:id});d.remove()}};
      d.querySelector("[data-e]").onclick=()=>ask("Edit: what should change?","",null,t=>{send("edit",{video:id,note:t});d.querySelector("[data-s]").textContent="Edit requested: "+t});
      const ub=d.querySelector("[data-u]");if(ub)ub.onclick=async()=>{try{await navigator.clipboard.writeText(pp.url);toast("Link copied ✓ paste it on the campaign page")}catch(e){toast("Copy failed: "+pp.url)}window.open(pp.campaignUrl,"_blank")};
      d.querySelectorAll("[data-k]").forEach(a=>a.addEventListener("click",()=>{try{navigator.clipboard.writeText(capOf(c))}catch(x){}const t=document.createElement("textarea");t.value=capOf(c);document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(y){}t.remove();d.querySelector("[data-s]").textContent="Caption copied ✓ - paste it in TikTok"}));
      const lb=d.querySelector("[data-l]");
      if(lb){const st=d.querySelector("[data-s]");let file=null,busy=false;const lbl=lb.textContent;
        const ready=b=>{file=new File([b],c.video.split("/").pop(),{type:"video/mp4"});busy=false;lb.disabled=false;lb.textContent="READY: tap to share to TikTok";st.textContent=""};
        const fromCache=()=>(window.caches?caches.match(c.video).then(r=>r?r.blob():null):Promise.resolve(null)).then(b=>{if(b&&b.size>100000){ready(b);return true}return false}).catch(()=>false);
        const load=(n=0)=>{if(file||(busy&&n===0))return;busy=true;lb.disabled=true;lb.textContent="Loading clip 0%";
          const x=new XMLHttpRequest();x.open("GET",c.video+(n?"?r="+n:""));x.responseType="blob";x.timeout=90000;
          x.onprogress=e=>{if(e.lengthComputable)lb.textContent="Loading clip "+Math.round(e.loaded/e.total*100)+"%";else lb.textContent="Loading clip "+(e.loaded/1e6).toFixed(1)+" MB"};
          x.onload=()=>{if(x.status!==200||!x.response||x.response.size<100000){return x.onerror()}ready(x.response)};
          x.onerror=x.ontimeout=()=>{if(n<3){st.textContent="Slow connection, retrying ("+(n+1)+"/3)...";load(n+1)}else{busy=false;lb.disabled=false;lb.textContent=lbl;st.textContent="Could not load the clip. Check signal/Wi-Fi and tap again."}};
          x.send()};
        const first=!list.querySelector("[data-l]");lb.disabled=true;lb.textContent="Checking saved clip...";
        fromCache().then(hit=>{if(!hit){lb.disabled=false;lb.textContent=lbl;if(first)load()}});
        
        lb.onclick=()=>{
          let ok=false;const t=document.createElement("textarea");t.value=capOf(c);t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(t);t.select();t.setSelectionRange(0,t.value.length);try{ok=document.execCommand("copy")}catch(y){}t.remove();
          if(ok)st.textContent="Caption copied ✓";
          if(!file){load();st.textContent=(ok?"Caption copied ✓. ":"")+"Loading the clip: when the button says READY, tap it again.";return}
          if(navigator.canShare&&navigator.canShare({files:[file]})){
            const after=m=>{st.innerHTML=m+' <a class="btn" data-k2 href="snssdk1233://music/detail/7698915706607749172">STEP 2: Open TikTok sound</a>';st.querySelector("[data-k2]").addEventListener("click",()=>{const t2=document.createElement("textarea");t2.value=capOf(c);document.body.appendChild(t2);t2.select();try{document.execCommand("copy")}catch(y){}t2.remove();try{navigator.clipboard.writeText(capOf(c))}catch(y){}})};
            navigator.share({files:[file],text:capOf(c)}).then(()=>after("Done. If TikTok was not in the list you must tap Save Video. Then:")).catch(e=>{if(e&&e.name==="AbortError")after("Share closed. Did you tap Save Video? Then:");else st.textContent="Share failed ("+(e&&e.name)+")"})
          }else{st.innerHTML='This browser cannot share files. <a class="btn" href="'+c.video+'" download>Download clip</a> then post it in TikTok (caption is copied).'}
        }}
      const pb=d.querySelector("[data-p]");if(pb)pb.onclick=()=>{const av=appr[c.campaign];if(av==="pending"||av==="changes"){toast("Not approved yet: "+(av==="pending"?"still Pending":"Needs changes")+" on Content Rewards. Not posting.");return}if(av!=="approved"&&!confirm("Before posting: is this clip APPROVED on Content Rewards (or does this campaign not need approval)?\n\nOK = yes, continue to post.\nCancel = not yet, do not post."))return;ask("Post: description",c.caption,true,async(t,when)=>{pb.disabled=true;const ok=await send("post",{video:id,description:t,when});if(!ok){pb.disabled=false;return}done[id]=true;save();d.classList.add("done");pb.remove();d.querySelector("[data-s]").textContent="Posting"+(when?" at "+new Date(when).toLocaleString():" now")+". It moves to the Posted tab when TikTok confirms."});};
      list.appendChild(d);
    }
    if(stage!=="todo"){const shown=new Set(clips.map(c=>c.video));
      for(const k in posted){const pp=posted[k];if(shown.has(k)||stageOf(pp)!==stage)continue;
        const d=document.createElement("div");d.className="card done";
        d.innerHTML=`<div><b>${esc(k.split("/").pop())}</b> <span class="mut">video file removed from cloud</span></div><div class="mut">Posted ${new Date(pp.postedAt).toLocaleString()} · ${pp.submitted?"Submitted ✓":"Not submitted"}</div><div class="row">${delBadge(pp)}</div><div class="row"><a class="btn" href="${pp.url}" target="_blank" rel="noopener">View on TikTok</a></div>`;
        list.appendChild(d)}}
  }catch(e){meta.textContent="Could not load clips: "+e.message}
}
const LADY_SOUND="https://www.tiktok.com/t/ZT9yBoXN5WkC4-cWL6r/";const isLady=c=>/^Lady A/.test(c.campaign||"");const capOf=c=>isLady(c)&&!/@ladya/i.test(c.caption)?c.caption+" @ladya":c.caption;
const VAPID_PUB="BJNmWV105vLUyZoulN5OFMbkSuOl3_9Srkv04CWXExZf16b9AIlOZblRAEFmcifOrEl7iL-9T5O6wU-vMXz2DZs";
function b64u(k){const p="=".repeat((4-k.length%4)%4),b=(k+p).replace(/-/g,"+").replace(/_/g,"/"),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(r=>r.active&&r.active.postMessage("precache")).catch(()=>{});
document.getElementById("pushbtn").onclick=async()=>{
  const m=document.getElementById("pushmsg");
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)){m.textContent="Open this from the Home Screen app (iOS 16.4+) to enable notifications.";return}
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){m.textContent="Notifications are blocked. Turn them on in iPhone Settings > Notifications > Snipvora.";return}
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)});
    const ta=document.getElementById("pushsub");ta.value=JSON.stringify(sub);ta.style.display="block";
    const cb=document.getElementById("pushcopy");cb.style.display="";
    cb.onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);cb.textContent="Copied ✓"}catch(e){ta.select();cb.textContent="Select + copy by hand"}};
    m.textContent="Enabled on this phone. Copy the code below and add it as GitHub secret PUSH_SUB (steps from Claude).";
  }catch(e){m.textContent="Could not enable: "+(e.name||e)}
};
main();
const camps=document.getElementById("camps"),list2=document.getElementById("list");
const joined=(()=>{try{return JSON.parse(localStorage.getItem("joined")||"{}")}catch(e){return{}}})();
const apprBox=document.getElementById("appr");
function showTab(n){list2.style.display=n===1?"":"none";camps.style.display=n===2?"block":"none";apprBox.style.display=n===3?"block":"none";
  [t1,t2,t3].forEach((b,i)=>b.classList.toggle("on",i+1===n));document.getElementById("meta").style.display=n===1?"":"none";if(n===3)drawAppr()}
document.getElementById("t1").onclick=()=>showTab(1);
document.getElementById("t2").onclick=()=>showTab(2);
document.getElementById("t3").onclick=()=>showTab(3);
const appr=(()=>{try{return JSON.parse(localStorage.getItem("appr")||"{}")}catch(e){return{}}})();
const apprSet=(n,v)=>{if(v)appr[n]=v;else delete appr[n];try{localStorage.setItem("appr",JSON.stringify(appr))}catch(e){}};
const AL={pending:["Pending","background:#ffe9a8;color:#6a4a00"],approved:["Approved","background:#d4f5dd;color:#0a6b2d"],changes:["Needs changes","background:#ffd5d5;color:#a00"]};
async function drawAppr(){
  let names=new Set(window._clipCamps||[]);

function analyze(cap,rules){ // quick read of the rules text: hard stops and warnings (a hint, not a judge)

  if(/official (tiktok |ig |instagram )?(sound|audio)|use the (provided )?audio|must use the audio/i.test(t))warn.push("Needs the official sound attached in the TikTok app (hard to automate; this broke Lady A).");
  if(/discord/i.test(t))warn.push("Needs joining a Discord to get paid.");
  if(/\b\d[\d,]*\s*\+?\s*followers/i.test(t))warn.push("Mentions a follower minimum.");
  if(/(fortnite|gaming|[a-z]+)[- ]focused account|dedicated (page|account) (is )?required|must have a dedicated/i.test(t))warn.push("Wants a niche-focused account (@snipvora is a general clipping account).");
  if(/\bapplication\b|\bapply\b/i.test(t)&&/required|must/i.test(t))warn.push("May need an application.");

  return{stop,warn,links};
}

  camps.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!confirm("Remove this campaign from the list?"))return;const id=b.dataset.rm;
    removedLocal[id]=1;try{localStorage.setItem("removedc",JSON.stringify(removedLocal))}catch(e){}
    await cloud("x-"+id,{id});window._cd=null;loadCamps()});
  camps.querySelectorAll("[data-job]").forEach(b=>b.onclick=async()=>{
    const a=b.dataset.job;if(a==="refresh"){window._cd=null;loadCamps();return}
    if(a==="stop"&&!confirm("Stop the cloud job for this campaign?"))return;
    b.disabled=true;
    try{const r=await fetch(WORKER_URL.replace(/\/$/,"")+"/job",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({campaign:b.dataset.id,action:a})});
      const j=await r.json().catch(()=>({}));
      toast(r.ok?(a==="stop"?"Stopped ✓":"Started ✓ it shows as running in a few seconds"):"Not done: "+(j.error||r.status));
    }catch(e){toast("Could not reach the helper")}
    setTimeout(()=>{window._cd=null;loadCamps()},3500)});
  camps.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>cp(b.dataset.cp));
}
loadCamps();
</script>
<dialog id="dlg"><h3></h3><textarea rows="5"></textarea><div data-t>Schedule for (optional)<input type="datetime-local"></div>
<div class="row"><button data-ok class="ok">OK</button><button onclick="document.getElementById('dlg').close()" style="background:#666">Cancel</button></div></dialog>
<div id="toast"></div></body></html>
