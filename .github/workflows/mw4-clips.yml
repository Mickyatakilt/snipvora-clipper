name: mw4-clips
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC daily = 15:00 EAT / 08:00 ET
concurrency:
  group: mw4-clips
  cancel-in-progress: false
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q playwright numpy && playwright install --with-deps chromium >/dev/null 2>&1 && echo ready
      - run: python mw4_clip.py
      - name: Grade clips (skipped until OPENAI_API_KEY secret exists)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python grade.py
      - name: Publish clips (release, newest 3 kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="clips-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" out/*.mp4 out/*.jpg --title "$tag" --notes "$(cat out/clips.json)"
          gh release list --limit 50 --json tagName --jq '.[].tagName' | grep '^clips-' | sort -r | tail -n +4 | xargs -r -I{} gh release delete {} --cleanup-tag --yes
      - name: Remember used windows (no repeats)
        run: |
          git config user.name "snipvora-bot"; git config user.email "bot@users.noreply.github.com"
          git add used.json && git commit -m "used windows $(date -u +%F)" && git pull --rebase -q && git push
      - name: Redeploy dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
      - name: Alert on failure
        if: failure()
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Snipvora clip job FAILED" -H "Priority: high" -d "$(cat alert.txt 2>/dev/null || echo 'MW4 cloud clipper failed - check GitHub Actions')" "https://ntfy.sh/$NTFY_TOPIC" || echo "no NTFY_TOPIC secret set yet"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
