name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site = dashboard + newest 3 clip runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/clips; cp -r docs/* site/
          echo "[]" > site/clips.json
          python3 - <<'P'
          import json, subprocess, os
          tags = subprocess.check_output(["gh","release","list","--limit","50","--json","tagName,publishedAt"], text=True)
          tags = sorted([t for t in json.loads(tags) if t["tagName"].startswith("clips-")], key=lambda t: t["tagName"], reverse=True)[:3]
          out = []
          for t in tags:
              tag = t["tagName"]; os.makedirs(f"site/clips/{tag}", exist_ok=True)
              subprocess.run(["gh","release","download",tag,"--dir",f"site/clips/{tag}","--clobber"], check=True)
              body = json.loads(subprocess.check_output(["gh","release","view",tag,"--json","body","--jq",".body"], text=True))
              for b in body:
                  f = os.path.basename(b["file"])
                  out.append({"tag": tag, "published": t["publishedAt"], "campaign": b.get("campaign",""), "caption": b["caption"], "campaignUrl": b.get("campaignUrl",""), "note": b.get("note",""), "grade": b.get("grade"), "reason": b.get("reason",""),
                              "video": f"clips/{tag}/{f}", "poster": f"clips/{tag}/{f.replace('.mp4','.jpg')}", "mb": round(os.path.getsize(f"site/clips/{tag}/{f}")/1e6)})
          json.dump(out, open("site/clips.json","w"), indent=1)
          print(len(out), "clips in site")
          posted = json.load(open("docs/posted.json")) if os.path.exists("docs/posted.json") else {}
          lady = sorted([c for c in out if c["campaign"].startswith("Lady A") and c["video"] not in posted], key=lambda c: (c["tag"], c["video"]), reverse=True)
          base = "https://mickyatakilt.github.io/snipvora-clipper/"
          nxt = {"video": base + lady[0]["video"], "caption": lady[0]["caption"] + (" @ladya" if "@ladya" not in lady[0]["caption"] else ""), "left": len(lady)} if lady else {"video": "", "caption": "", "left": 0}
          json.dump(nxt, open("site/lady_next.json","w"))
          print("lady_next", nxt)
          if lady:
              import shutil
              shutil.copyfile("site/" + lady[0]["video"], "site/next.mp4")
              open("site/caption.txt", "w").write(nxt["caption"])
          P
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
