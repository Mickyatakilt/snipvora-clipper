name: post-clip
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Path on the Pages site, e.g. clips/clips-xxx/mw4_clip1.mp4"
        required: true
      caption:
        description: "Leave empty to use the caption stored for this clip in clips.json (recommended)"
        required: false
        default: ""
      when:
        description: "ISO time to schedule, empty = publish now"
        required: false
        default: ""
concurrency:
  group: post-clip
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Post to TikTok @snipvora through GHL
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          VIDEO: ${{ inputs.video }}
          CAPTION: ${{ inputs.caption }}
          WHEN: ${{ inputs.when }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          LOC=gF9BSz3b2ZNux9RPKYAG
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          curl -s https://mickyatakilt.github.io/snipvora-clipper/clips.json > /tmp/clips.json
          H=(-H "Authorization: Bearer $GHL_TOKEN" -H "Version: 2021-07-28" -H "Content-Type: application/json")
          URL="https://mickyatakilt.github.io/snipvora-clipper/$VIDEO"
          if [ -z "$CAPTION" ]; then
            CAPTION=$(curl -s https://mickyatakilt.github.io/snipvora-clipper/clips.json | VID="$VIDEO" python3 -c "import json,sys,os;print(next(c['caption'] for c in json.load(sys.stdin) if c['video']==os.environ['VID']))")
            export CAPTION
          fi
          echo "caption: $CAPTION"
          # TikTok only accepts media hosted on a verified domain: copy the clip into GHL media storage first
          curl -sfL -o clip.mp4 "$URL"
          curl -s -o up.json -w 'upload HTTP %{http_code}\n' -X POST -H "Authorization: Bearer $GHL_TOKEN" -H "Version: 2021-07-28" \
            -F "file=@clip.mp4;type=video/mp4" -F "name=$(basename "$VIDEO" .mp4)-$(date +%s).mp4" \
            "https://services.leadconnectorhq.com/medias/upload-file"
          python3 -c "import json;d=json.load(open('up.json'));print({k:v for k,v in d.items() if k!='traceId'})"
          URL=$(python3 -c "import json;print(json.load(open('up.json'))['url'])")
          echo "hosted url host: $(echo $URL | cut -d/ -f3)"
          curl -sfI "$URL" >/dev/null || { echo "video not reachable: $URL"; exit 1; }
          ACC=$(curl -s "${H[@]}" "https://services.leadconnectorhq.com/social-media-posting/$LOC/accounts" | python3 -c "import json,sys;a=json.load(sys.stdin)['results']['accounts'];t=[x for x in a if x['platform']=='tiktok'];print(t[0]['id'])")
          echo "tiktok account id: $ACC"
          USR=$(curl -s "${H[@]}" "https://services.leadconnectorhq.com/users/?locationId=$LOC" | python3 -c "import json,sys;u=json.load(sys.stdin)['users'];print(len(u),file=sys.stderr);print(u[0]['id'])")
          echo "user id: $USR"
          python3 - <<PY > body.json
          import json,os
          w=os.environ.get('WHEN') or None
          b={"accountIds":["$ACC"],"userId":"$USR","summary":os.environ['CAPTION'],"media":[{"url":"$URL","type":"video/mp4"}],
             "type":"post","status":"scheduled" if w else "published",
             "tiktokPostDetails":{"privacyLevel":"PUBLIC_TO_EVERYONE","enableComment":True,"enableDuet":True,"enableStitch":True,"promoteOtherBrand":True,"videoDisclosure":True}}
          if w: b["scheduleDate"]=w
          print(json.dumps(b))
          PY
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST "${H[@]}" -d @body.json "https://services.leadconnectorhq.com/social-media-posting/$LOC/posts")
          echo "HTTP $code"; head -c 1500 resp.json; echo
          sleep 30
          echo "--- recent posts in GHL (status) ---"
          curl -s -X POST "${H[@]}" -d '{"type":"all","accounts":"'$ACC'","skip":"0","limit":"5","includeUsers":"false"}' "https://services.leadconnectorhq.com/social-media-posting/$LOC/posts/list" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in (d.get('results') or {}).get('posts',[])[:5]: print(p.get('status'),'|',p.get('createdAt'),'|',(p.get('summary') or '')[:50].replace(chr(10),' / '),'|',p.get('failureReason') or p.get('error') or '')
          print(str(d)[:300] if not (d.get('results') or {}).get('posts') else '')
          "
          [ "$code" -lt 300 ] || exit 1
          echo "--- waiting for TikTok to publish ---"
          for i in $(seq 1 18); do
            curl -s -X POST "${H[@]}" -d '{"type":"all","accounts":"'$ACC'","skip":"0","limit":"5","includeUsers":"false"}' "https://services.leadconnectorhq.com/social-media-posting/$LOC/posts/list" > list.json
            if python3 - <<PY
          import json,os,sys
          d=json.load(open('list.json')); cap=os.environ['CAPTION']
          for p in (d.get('results') or {}).get('posts',[]):
              if p.get('status')=='published' and p.get('previewLink') and p.get('summary')==cap and p.get('createdAt','')>="$START":
                  m=json.load(open('docs/posted.json')) if os.path.exists('docs/posted.json') else {}
                  camp=next((c.get('campaignUrl') for c in json.load(open('/tmp/clips.json')) if c['video']=="$VIDEO"),None) or "https://contentrewards.com/c/campaigns/7a73a53b-2bba-4a5c-8187-05534dd6716d"
                  m["$VIDEO"]={"url":p['previewLink'],"postedAt":p.get('publishedAt'),"campaignUrl":camp,"submitted":False}
                  json.dump(m,open('docs/posted.json','w'),indent=1); print("PUBLISHED",p['previewLink']); sys.exit(0)
          sys.exit(1)
          PY
            then break; fi
            sleep 10
          done
          git config user.name snipvora-bot; git config user.email bot@users.noreply.github.com
          git add docs/posted.json && git commit -m "posted: $VIDEO" && git pull --rebase -q && git push
          gh workflow run deploy.yml
      - name: Phone alert - submit within 30 minutes
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VIDEO: ${{ inputs.video }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "no NTFY_TOPIC secret"; exit 0; }
          url=$(python3 -c "import json,os;print(json.load(open('docs/posted.json'))[os.environ['VIDEO']]['url'])")
          camp=$(python3 -c "import json,os;print(json.load(open('docs/posted.json'))[os.environ['VIDEO']]['campaignUrl'])")
          curl -s -H "Title: Posted! Submit within 30 min" -H "Priority: high" -H "Click: $camp" -d "TikTok link: $url - tap to open the campaign and paste it." "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
      - name: Push - submit within 30 minutes
        if: success()
        env:
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pip install -q --break-system-packages pywebpush 2>/dev/null || pip install -q pywebpush
          VIDEO="${{ inputs.video }}" python3 - <<'PY'
          import json,os,subprocess
          v=os.environ["VIDEO"]; m=json.load(open("docs/posted.json"))[v]
          subprocess.run(["python","push.py","Posted! Submit within 30 min","TikTok link: "+m["url"],m["campaignUrl"]])
          PY
