name: test-footage
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright && playwright install --with-deps chromium >/dev/null 2>&1; echo installed
      - name: Find MediaSilo + Picflow download URLs
        run: |
          cat > f.py <<'P'
          import asyncio, re
          from playwright.async_api import async_playwright
          async def go(url, label):
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page()
                  seen=set()
                  pg.on("response", lambda r: seen.add((r.status, r.headers.get("content-type","")[:30], re.sub(r"\?.*","",r.url)[:110])) if re.search(r"\.(mp4|mov|m3u8)|video|download", r.url+r.headers.get("content-type",""), re.I) else None)
                  await pg.goto(url, wait_until="networkidle", timeout=60000)
                  await pg.wait_for_timeout(8000)
                  print(label, "TITLE:", await pg.title()); print(label, "TEXT:", (await pg.inner_text("body"))[:300].replace("\n"," | "))
                  for s in sorted(seen)[:12]: print(label, "NET:", s)
                  await b.close()
          asyncio.run(go("https://app.mediasilo.com/review/6ae109cef2c6470f09434547/f/28abc944-ea6b-4c31-8412-2feabade068e","MEDIASILO"))
          asyncio.run(go("https://diggzy.picflow.com/ZK1uf2VY1HP9BplH","PICFLOW"))
          P
          python f.py
