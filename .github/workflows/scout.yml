name: scout
on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scout.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: cp latest.json docs/latest.json
      - run: |
          git config user.name "scout"; git config user.email "scout@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -m "scout $(date -u +%F)"; git push
      - run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
